<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    background-color:#1f1b15;
    background-image:linear-gradient(180deg,#0f0b08 0%,#1f1b15 52%,#0f0b08 100%);
    font-family:"Rubik",system-ui,sans-serif;color:#f5eee0;position:relative}
  .glow{position:absolute;inset:0;
    background:radial-gradient(ellipse 900px 560px at 20% 40%,rgba(212,85,43,.26),rgba(212,85,43,.07) 45%,transparent 72%)}
  .wrap{position:relative;padding:74px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:12px}
  .dot{width:14px;height:14px;border-radius:50%;background:#d4552b}
  .brand{font-weight:700;font-size:23px;letter-spacing:-.01em}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.18em;color:#7ba4a5;margin-left:6px}
  h1{font-size:82px;font-weight:800;line-height:.98;letter-spacing:-.025em;
    text-shadow:0 2px 4px rgba(0,0,0,.5),0 10px 40px rgba(212,85,43,.2)}
  h1 em{font-style:italic;font-weight:500}
  .sub{margin-top:26px;font-size:25px;line-height:1.4;color:rgba(245,238,224,.78);max-width:900px}
  .foot{display:flex;gap:12px}
  .chip{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.06em;
    color:rgba(245,238,224,.72);padding:10px 18px;border-radius:999px;
    border:1px solid rgba(123,164,165,.30);background:rgba(123,164,165,.07)}
  .rule{width:56px;height:3px;background:#d4552b;border-radius:2px;margin-bottom:30px}
</style></head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="dot"></span><span class="brand">Ogarocious</span><span class="eyebrow">NOTES FOR ADAM · KOVA</span></div>
  <div>
    <div class="rule"></div>
    <h1>Firm one is a build.<br/><em>Firm ten should be a form.</em></h1>
    <p class="sub">What your site promises, where per firm onboarding cost actually lives, and one call traced all the way into GHL.</p>
  </div>
  <div class="foot">
    <span class="chip">Clio · Lawmatics · GHL</span>
    <span class="chip">6 minute read</span>
    <span class="chip">Sep 7, 2026</span>
  </div>
</div>
</body></html>

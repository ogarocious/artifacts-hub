<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keystone - Ogarocious</title>
  <meta name="description" content="Keystone: a read-only X-ray of how a company actually runs. Every automation, who can access what, and where the software money goes, in one dashboard. Sample data." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  /* Diaspora Modern - Ogarocious brand palette */
  --bg: #0f0b08; --panel: #1a1410; --raise: #221c16;
  --ink: #f5eee0; --muted: #b5ae9f; --faint: #8f8878;
  --line: #312d23; --line-strong: #4b4638; --link: #6b6557;
  --accent: #d4552b; --amber: #c99647; --teal: #7ba4a5;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --label: "Bricolage Grotesque", system-ui, sans-serif;
  --mono: "Inter", -apple-system, Arial, sans-serif;
  --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

/* ---- App bar ---- */
.appbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  gap: 20px; padding: 16px 32px; background: rgba(15,11,8,.86); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-strong);
}
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.brand .product { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.brand .client { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mainnav { display: flex; gap: 4px; }
.mainnav button {
  font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .01em;
  padding: 8px 15px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 7px;
}
.mainnav button:hover { color: var(--ink); background: var(--raise); }
.mainnav button.active { background: var(--ink); color: var(--bg); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 30px 32px 90px; }

/* ---- Overview ---- */
.ov-head { margin-bottom: 26px; }
.ov-title { font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: -.02em; margin: 0; }
.ov-sub { font-family: var(--sans); font-size: 17px; color: var(--muted); margin: 8px 0 0; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--fa); border-radius: 12px; padding: 18px 20px 20px; }
.kpi-label { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.kpi-value { font-family: var(--display); font-weight: 700; font-size: 38px; letter-spacing: -.02em; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.kpi-meta { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.kpi-meta.bad { color: var(--accent); }

.ov-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 8px; margin-bottom: 28px; }
.ov-panel-head { display: flex; align-items: baseline; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.ov-panel-head h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
.ov-panel-meta { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.feed-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
.feed-row:last-child { border-bottom: 0; }
.feed-row:hover { background: var(--raise); }
.layer-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.feed-main { flex: 1; min-width: 0; }
.feed-name { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 9px; }
.feed-sum { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-badge { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid; }
.feed-badge.failing { color: var(--accent); border-color: var(--accent); background: rgba(212,85,43,.15); }
.feed-badge.needs-attention { color: var(--amber); border-color: var(--amber); background: rgba(201,150,71,.15); }
.feed-layer { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

.ov-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.ov-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--fa); border-radius: 12px; padding: 20px 20px 18px; cursor: pointer; transition: background .12s, transform .12s; }
.ov-card:hover { background: var(--raise); transform: translateY(-2px); }
.card-top { display: flex; align-items: baseline; gap: 10px; }
.card-n { font-family: var(--mono); font-size: 12px; color: var(--fa); font-weight: 600; }
.card-top h4 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card-blurb { font-size: 13.5px; color: var(--muted); line-height: 1.45; margin: 10px 0 14px; }
.card-stat { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.card-attn { color: var(--accent); }
.card-go { font-family: var(--label); font-weight: 600; font-size: 13px; color: var(--fa); margin-top: 14px; }

/* ---- Layer head ---- */
.layerhead { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line-strong); padding-bottom: 14px; }
.layerhead h1 { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: -.02em; margin: 0; }
.layerhead .sub { font-family: var(--sans); font-weight: 500; font-size: 13px; color: var(--muted); }
.layerhead .sub .attn { color: var(--accent); }
.spacer { flex: 1; }
.toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.toggle button { font-family: var(--label); font-size: 13px; font-weight: 600; padding: 7px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.toggle button.active { background: var(--ink); color: var(--bg); }

/* ---- Filter bar ---- */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0 10px; }
.filterbar .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.chip { font-family: var(--sans); font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--panel); cursor: pointer; color: var(--ink); user-select: none; }
.chip .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chip .ct { color: var(--faint); font-variant-numeric: tabular-nums; }
.chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.active .ct { color: #55524b; }
.chip.text { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 5px 9px; }
.chip.attn { border-color: var(--accent); color: var(--accent); }
.chip.attn.active { background: var(--accent); color: var(--bg); }
.hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 16px; }
.hint b { color: var(--ink); }

/* ---- System map (Sankey) ---- */
.mapwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 16px; position: relative; overflow-x: auto; }
.mapwrap .route { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .05em; padding: 8px 10px 4px; }
.colhead { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 2px 14px 10px; }
svg.sankey { width: 100%; min-width: 620px; display: block; }
.node rect { cursor: pointer; }
.node-box { fill: var(--panel); stroke: var(--line-strong); stroke-width: 1; }
.node-label { font-family: var(--sans); font-size: 13px; fill: var(--ink); dominant-baseline: middle; }
.node-count { font-family: var(--mono); font-size: 12px; fill: var(--faint); dominant-baseline: middle; }
.area-label { font-family: var(--sans); font-size: 13.5px; font-weight: 600; fill: var(--ink); dominant-baseline: middle; }
.link { fill: none; stroke: var(--link); stroke-opacity: .4; transition: stroke-opacity .15s; }
.link.active { stroke-opacity: .62; }
.link.faded { stroke-opacity: .05; }
.node.faded { opacity: .28; }
.areabox { fill: var(--panel); stroke: var(--line-strong); cursor: pointer; }
.areabox.focused { fill: var(--ink); }
.area-label.focused { fill: var(--bg); }
.area-count.focused { fill: #55524b; }

/* ---- List view ---- */
.group { margin-top: 26px; }
.group-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line-strong); padding-bottom: 7px; }
.group-head h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.group-head .meta { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--muted); }
.group-head .meta .attn { color: var(--accent); }
.group-head .cols { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.row { display: flex; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--raise); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 9px; }
.row .desc { color: var(--muted); font-size: 13.5px; margin-top: 3px; line-height: 1.45; }
.row .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sys-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--raise); white-space: nowrap; }
.sys-pill .sw { width: 9px; height: 9px; border-radius: 2px; }
.flow .arrow, .flow .trig { color: var(--faint); }
.row .right { text-align: right; font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.row .right .mode { display: inline-block; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; letter-spacing: .08em; color: var(--muted); }
.row .right .last { margin-top: 8px; color: var(--muted); }
.row .right .last.bad { color: var(--accent); }

/* status badges */
.badge { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid; }
.badge.failing { color: var(--accent); border-color: var(--accent); background: rgba(212,85,43,.16); }
.badge.needs-attention { color: var(--amber); border-color: var(--amber); background: rgba(201,150,71,.15); }
.badge.not-recorded { color: var(--faint); border-color: var(--line-strong); background: rgba(255,255,255,.03); }

/* ---- Drawer ---- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(680px, 94vw); background: var(--panel); border-left: 1px solid var(--line-strong); z-index: 21; transform: translateX(100%); transition: transform .22s ease; overflow-y: auto; box-shadow: -18px 0 50px rgba(0,0,0,.45); }
.drawer.open { transform: translateX(0); }
.drawer .route { font-family: var(--mono); font-size: 11px; color: var(--faint); background: var(--raise); padding: 9px 22px; border-bottom: 1px solid var(--line); letter-spacing: .04em; }
.drawer .dbody { padding: 22px 26px 60px; }
.drawer .close { position: absolute; top: 34px; right: 22px; border: 0; background: transparent; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; }
.drawer .summary { font-family: var(--display); font-weight: 500; font-size: 21px; line-height: 1.35; margin: 6px 44px 14px 0; }
.drawer .health-line { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.drawer .health-line.bad { color: var(--accent); }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.dcol h4 { font-family: var(--display); font-weight: 600; font-size: 16px; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 7px; }
.spec { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; font-size: 13px; }
.spec dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding-top: 2px; }
.spec dd { margin: 0; color: var(--ink); }
.spec dd.bad { color: var(--accent); }
.spec ul { margin: 0; padding-left: 16px; }
.spec ul li { margin-bottom: 4px; }
.runs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.runs th { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-weight: 500; }
.runs td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.runs .st { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line-strong); border-radius: 4px; }
.runs .st.failed, .runs .st.admin { color: var(--accent); border-color: var(--accent); background: rgba(212,85,43,.15); }
.runs .st.overdue, .runs .st.dormant, .runs .st.upcoming { color: var(--amber); border-color: var(--amber); background: rgba(201,150,71,.15); }
.runs .st.quiet { color: var(--faint); }
.runs .st.revoked { color: var(--faint); border-color: var(--line-strong); text-decoration: line-through; }
.runs .st.editor, .runs .st.viewer, .runs .st.paid, .runs .st.member { color: var(--muted); border-color: var(--line-strong); }
.empty { color: var(--faint); font-size: 13px; font-style: italic; }

.footnote { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 40px; border-top: 1px solid var(--line); padding-top: 14px; }
.hidden { display: none !important; }

@media (max-width: 820px) {
  .appbar { flex-wrap: wrap; gap: 10px; padding: 14px 18px; }
  .wrap { padding: 22px 18px 70px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .ov-cards { grid-template-columns: 1fr; }
  .dgrid { grid-template-columns: 1fr; gap: 22px; }
  .layerhead { flex-wrap: wrap; gap: 8px 14px; }
}

  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="product">Keystone</span>
      <span class="client" id="clientName"></span>
    </div>
    <nav class="mainnav" id="mainnav">
      <button data-layer="overview" class="active">Overview</button>
      <button data-layer="workflows">Workflows</button>
      <button data-layer="access">Access</button>
      <button data-layer="spend">Spend</button>
    </nav>
  </header>

  <main class="wrap">
    <!-- Overview -->
    <section id="overview"></section>

    <!-- Drilled layer -->
    <section id="layer" class="hidden">
      <div class="layerhead">
        <h1 id="layerTitle"></h1>
        <span class="sub" id="summary"></span>
        <span class="spacer"></span>
        <div class="toggle" id="viewToggle">
          <button data-view="map" class="active">Map</button>
          <button data-view="list">List</button>
        </div>
      </div>
      <div class="filterbar" id="systemFilter"></div>
      <p class="hint" id="hint"></p>
      <section id="mapView">
        <div class="mapwrap">
          <div class="route" id="mapRoute"></div>
          <div class="colhead"><span id="colFrom"></span><span id="platformCol"></span><span id="colTo"></span></div>
          <svg class="sankey" id="sankey"></svg>
        </div>
      </section>
      <section id="listView" class="hidden"></section>
    </section>

    <div class="footnote">Sample data. Status, access levels, costs and run history are examples.</div>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="route" id="drawerRoute"></div>
    <button class="close" id="drawerClose" aria-label="Close">×</button>
    <div class="dbody" id="drawerBody"></div>
  </aside>

  <script>

// One file per client holds all three layers. Swap this, keep the shell identical.

    },

  <script>
/* Ground Truth dashboard shell. One config (window.GT) with three layers.
   The Overview rolls up all layers; each layer runs the same map/list/drawer engine. */
(function () {
  const GT = window.GT;
  const LAYERS = GT.layers;
  const META = {
    workflows: { nav: "Workflows", title: "What runs",          accent: "#7ba4a5",
      blurb: "Every automation, what sets it off, and what is quietly broken." },
    access:    { nav: "Access",    title: "Who can get in",      accent: "#d4552b",
      blurb: "Who can touch what, and who still holds keys they should not." },
    spend:     { nav: "Spend",     title: "Where the money goes", accent: "#c99647",
      blurb: "Where the software money goes, and what nobody opens." }
  };
  const ORDER = ["workflows", "access", "spend"];

  // ---- per-layer runtime (set by useLayer) ----
  let DATA, C, PLATFORM, ROUTE, NOUN, ATTN, sysById, areaById;
  let active = "overview";
  const state = { view: "map", focusSystem: null, focusArea: null, attnOnly: false };

  const wt = a => (a.weight != null ? a.weight : 1);
  const fmtVal = n => C && C.money ? "$" + Math.round(n).toLocaleString() : String(n);
  const ext = arr => (arr || []).filter(x => x !== "foundation");
  const touches = (a, id) => a.sources.includes(id) || a.destinations.includes(id);
  const isInternal = a => ext(a.sources).length === 0 && ext(a.destinations).length === 0;
  const needsAttn = a => a.health === "failing" || a.health === "needs-attention";
  const sysColor = id => (sysById[id] && sysById[id].color) || "#9a948a";
  const sysName = id => (sysById[id] && sysById[id].name) || id;

  function useLayer(key) {
    DATA = LAYERS[key];
    C = DATA.copy || {};
    PLATFORM = DATA.platformName || "Foundation";
    ROUTE = C.routeBase || "/workflows";
    NOUN = C.itemNoun || "workflows";
    ATTN = C.attnVerb || "need attention";
    sysById = Object.fromEntries(DATA.systems.map(s => [s.id, s]));
    areaById = Object.fromEntries(DATA.areas.map(a => [a.id, a]));
    state.view = "map"; state.focusSystem = null; state.focusArea = null; state.attnOnly = false;
  }

  // ---- layer stats for the overview ----
  function statFor(key) {
    const d = LAYERS[key];
    const autos = d.automations;
    const attn = autos.filter(a => a.health === "failing" || a.health === "needs-attention").length;
    const failing = autos.filter(a => a.health === "failing").length;
    const money = d.copy && d.copy.money;
    const total = money ? autos.reduce((s, a) => s + (a.weight != null ? a.weight : 1), 0) : null;
    const tools = new Set();
    autos.forEach(a => (a.destinations || []).forEach(x => { if (x !== "foundation") tools.add(x); }));
    return { count: autos.length, attn, failing, total, tools: tools.size, money };
  }

  // ---------- Overview ----------
  function renderOverview() {
    const host = document.getElementById("overview");
    host.innerHTML = "";
    const wf = statFor("workflows"), ac = statFor("access"), sp = statFor("spend");
    const totalAttn = wf.attn + ac.attn + sp.attn;

    const head = el("div", "ov-head");
    head.appendChild(el("h1", "ov-title", "The X-ray"));
    head.appendChild(el("p", "ov-sub", "Everything your company can't see about itself, in one place."));
    host.appendChild(head);

    // KPI tiles
    const kpis = el("div", "kpis");
    kpis.appendChild(kpi("Automations running", String(wf.count), wf.failing ? wf.failing + " failing" : "all healthy", wf.failing ? "bad" : "", META.workflows.accent));
    kpis.appendChild(kpi("People with access", String(ac.count), ac.tools + " systems", "", META.access.accent));

  // ---------- derived graph (per active layer) ----------
  function buildGraph() {

      ext(a.destinations).forEach(d => addLink("area:" + a.area, "dst:" + d, d, a));
    });
    function addLink(from, to, system, a) {
      const k = from + "|" + to;
      if (!linkMap.has(k)) linkMap.set(k, { from, to, system, value: 0, autos: [] });
      const l = linkMap.get(k); l.value += wt(a); l.autos.push(a);
    }
    const links = [...linkMap.values()];
    const sumW = arr => arr.reduce((s, a) => s + wt(a), 0);
    const srcIds = DATA.systems.map(s => s.id).filter(id => DATA.automations.some(a => ext(a.sources).includes(id)));
    const dstIds = DATA.systems.map(s => s.id).filter(id => DATA.automations.some(a => ext(a.destinations).includes(id)));
    const areaIds = DATA.areas.map(a => a.id).filter(id => DATA.automations.some(x => x.area === id));
    const col0 = srcIds.map(id => ({ key: "src:" + id, kind: "system", id, label: sysName(id), color: sysColor(id), count: sumW(DATA.automations.filter(a => ext(a.sources).includes(id))) }));
    const col1 = areaIds.map(id => ({ key: "area:" + id, kind: "area", id, label: areaById[id].name, count: sumW(DATA.automations.filter(a => a.area === id)) }));
    const col2 = dstIds.map(id => ({ key: "dst:" + id, kind: "system", id, label: sysName(id), color: sysColor(id), count: sumW(DATA.automations.filter(a => ext(a.destinations).includes(id))) }));

  function focusedKeys() {

    if (state.focusArea) return ["area:" + state.focusArea];

  function focusCount() {

  function renderMap() {

    svg.innerHTML = "";

    const BOX_H = 30, GAP = 14, PAD_TOP = 10;
    const colH = n => n * BOX_H + (n - 1) * GAP;
    const H = Math.max(colH(g.col0.length), colH(g.col1.length), colH(g.col2.length)) + PAD_TOP * 2;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px";
    const SYS_W = 168, AREA_W = 180;
    const x = { 0: 0, 1: (W - AREA_W) / 2, 2: W - SYS_W };
    const colW = { 0: SYS_W, 1: AREA_W, 2: SYS_W };
    const pos = {};
    [g.col0, g.col1, g.col2].forEach((col, ci) => {
      const total = colH(col.length);
      let y = PAD_TOP + (H - PAD_TOP * 2 - total) / 2;
      col.forEach(n => { pos[n.key] = { x0: x[ci], x1: x[ci] + colW[ci], y0: y, cy: y + BOX_H / 2, w: colW[ci] }; y += BOX_H + GAP; });

    const fkeys = focusedKeys();
    const maxV = Math.max(1, ...g.links.map(l => l.value));

    g.links.forEach(l => {

      const faded = fkeys && !act;

      if (act) path.setAttribute("stroke", l.color);
      svg.appendChild(path);

    [g.col0, g.col1, g.col2].forEach(col => col.forEach(n => {

      grp.appendChild(svgEl("rect", { x: p.x0, y: p.y0, width: p.w, height: BOX_H, rx: 5, class: isArea ? ("areabox" + (focusedNode ? " focused" : "")) : "node-box" }));

        grp.appendChild(text(p.x0 + 28, p.cy, n.label, "node-label"));
        grp.appendChild(text(p.x1 - 12, p.cy, fmtVal(n.count), "node-count", "end"));
      } else {
        grp.appendChild(text(p.x0 + 14, p.cy, n.label, "area-label" + (focusedNode ? " focused" : "")));
        grp.appendChild(text(p.x1 - 12, p.cy, fmtVal(n.count), "node-count area-count" + (focusedNode ? " focused" : ""), "end"));
      }
      grp.onclick = () => {
        if (isArea) { state.focusSystem = null; state.focusArea = state.focusArea === n.id ? null : n.id; renderLayerBody(); return; }
        const rec = DATA.automations.find(a => a.id === n.id);
        if (rec) { openDrawer(rec); return; }
        if (hasRegister(n.id)) { openSystemDrawer(n.id); return; }
        toggleSystem(n.id);

      svg.appendChild(grp);

  }

  function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : ms + " ms"; }
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function svgEl(tag, attrs) { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function text(x, y, str, cls, anchor) { const t = svgEl("text", { x, y, class: cls, "text-anchor": anchor || "start" }); t.textContent = str; return t; }

  function renderLayerBody() {
    const cf = document.getElementById("colFrom"); if (cf) cf.textContent = C.colFrom || "Data comes from";
    const ct = document.getElementById("colTo"); if (ct) ct.textContent = C.colTo || "Data goes to";
    document.getElementById("summary").innerHTML =
      `<span>${DATA.automations.length} ${NOUN}</span>` +
      (C.money ? ` · <span>${fmtVal(DATA.automations.reduce((s, a) => s + wt(a), 0))}${C.perLabel || ""}</span>` : "") +
      ` · <span class="attn">${DATA.automations.filter(needsAttn).length} ${ATTN}</span>`;
    renderFilter(); renderHint();
    const mapOn = state.view === "map";
    document.getElementById("mapView").classList.toggle("hidden", !mapOn);
    document.getElementById("listView").classList.toggle("hidden", mapOn);
    if (mapOn) renderMap(); else renderList();
    [...document.querySelectorAll("#viewToggle button")].forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
  }

  // ---- events ----
  document.getElementById("mainnav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setActive(b.dataset.layer); });
  document.getElementById("viewToggle").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.view; renderLayerBody(); });
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
  window.addEventListener("resize", () => { if (active !== "overview" && state.view === "map") renderMap(); });

  document.getElementById("clientName").textContent = GT.client + "  ·  as of " + GT.generatedAt;
  show();
})();

  </script>
</body>
</html>
